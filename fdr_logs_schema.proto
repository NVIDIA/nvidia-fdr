syntax = "proto3";

package fdrpb;

message fdr_sample {
  uint64 TimeStamp = 1; // Time at which this sample was captured
  oneof ParamValue {     // Value of this sample
    string ParamValueString = 2; // Applicable when InfoType==string
    int64 ParamValueInt64 = 3;   // Applicable when InfoType==Uint64
    double ParamValueDouble = 4;   // Applicable when InfoType==Double
  }
  optional uint64 ParamID = 5; // Unique parameter ID (Used to identify parameter name)
}

message fdr_stat {
  uint64 FromTime = 1;   // Start of time period within which samples lie
  uint64 ToTime = 2;     // End of time period within which samples lie
  int64 NumSamples = 3; // Number of samples this stat took into consideration
  double Min = 4;        // Minimum value seen across all samples
  double Max = 5;        // Maximum value seen across all samples
  double Avg = 6;        // Average values for the sample set
  uint64 MinValTimeStamp = 7; // Time at which MINIMUM value occured during this samples
  uint64 MaxValTimeStamp = 8; // Time at which MAXIMUM value occured during this samples
  optional uint64 ParamID = 9; // Unique parameter ID (Used to identify parameter name)
}

message fdr_params {
  string CompClass = 1; // e.g. GPU, NVSWITCH, FPGA etc.
  string ParamClass = 2; // e.g. Config, Inventory etc.
  string ParamName = 3; // e.g. VENDOR, CURR-CLK-MEM etc.
  optional uint64 ParamID = 4; // Unique parameter ID (Used to identify parameter name)
  string ParamType = 5;  // Type of this sample Uint64|String|Binary etc.
  string ParamUnit = 6; // Unit of the sample, e.g. Celsius, Hz, Watts etc.
  string ParamNotes = 7; // Additional notes about the parameter
}

message fdr_compactor_bookkeep {
  string CompactDirectory = 1; // name of the directory to compact throughout FDR
}

message fdr_book_of_errors {
  string BootId = 1;          // Boot Index/Counter of the Host
  string DeviceInstance = 2;  // device instance on which error occured [should be same as Sections.Components.ID like, GPU0,GPU1, NVSwitch0, Retimer1, etc]
                              // CompClass can be dervied from DeviceInstance itself. This DeviceInstance is little different than
                              // all other DeviceInstance in other message structs, where in the latter, it only holds the number 0,1, etc.
  string ErrorType = 3;       // type of error [may be of type Threshold, Fault, PCIe, etc]
  optional uint64 ParamID = 4;      // Unique parameter ID (Used to identify parameter name)
  uint64 ErrorOccurTimeStamp = 5; // Time at which this error occured
  uint64 StartHifiTimeStamp = 6;  // ErrorOccurTimeStamp - HiFi-Data-Preserve-Time
  uint64 StopHifiTimeStamp = 7;   // ErrorOccurTimeStamp + HiFi-Data-Preserve-Time
}

message fdr_event {
  uint64 EventTimeStamp = 1; // Time at which event occured
  string EventName = 2; // Type of event occured
  string EventLoggingPath = 3; // Full path of event details getting stored
}

message fdr_event_details {
  uint64 EventTimeStamp = 1; // Time at which event occured
  string EventName = 2; // Type of event occured
  string EventDeviceName = 3; // System device name
  string EventMessage = 4; // Details of event occured
  string EventOriginOfCondition = 5; // Associated device where event occurred
  string EventAdditionalInfo = 6; // Descriptive information for event
}

message fdr_boot_event {
  uint64 EventTimeStamp = 1; // Time at which FDR booted
  string BootId = 2;   // number of times HMC booted. Even though its a counter, data type is string purposefully.
  string UpTime = 3;    // uptime of HMC [output of uptime -s]
  uint32 DataDirFormatVersion = 4;  // data/directory structure layout format followed in FDR
}

// Cross-boot record of terminal device-dump collection failures.
// Written append-mode to Bookkeeper/DeviceDumpFailures.dat as
// length-delimited protobuf, shared across all DumpProfiles and across
// all boots (BootId field is the per-record boot key). Emitted alongside
// a phosphor-logging Entry so operators see failures in the Redfish
// EventLog while the on-disk record persists for HMC-lifetime queries
// like "did this device ever fail to collect?" — outliving any
// individual BootCount_* directory cleanup.
message fdr_device_dump_failure {
  uint64 EventTimeStamp = 1;  // When the failure was recorded
  string ProfileName    = 2;  // PPF DumpProfile name (e.g. "GpuDump")
  string DeviceId       = 3;  // Component ID; empty if pre-device stage
  uint32 EventCode      = 4;  // Triggering XID/code (0 if not applicable)
  string FailureStage   = 5;  // DiskSpaceCheck | GetDiagnostics | AsyncStatus | StoreWriteFailed
  string ErrorDetail    = 6;  // Exception what() or free-form reason
  uint32 AttemptCount   = 7;  // Retries exhausted (0 if not retry-driven)
  string BootId         = 8;  // Matches fdr_boot_event.BootId
}

// Cross-boot index of every device-dump collection event (success and
// failure). Written append-mode to Bookkeeper/DeviceDumpRecords.dat as
// length-delimited protobuf, shared across all DumpProfiles and all
// boots. BootId field is the per-record boot key. Lets an offline
// analyst enumerate "all GpuDumps ever collected on this HMC, with
// outcome" from a single file — no BootCount_* directory walk needed.
// Sibling of BookOfErrors.dat: same Bookkeeper/ home, same lifetime
// semantics (survives BootCount_* cleanup), same Compactor-eligible
// shape. Coexists with DeviceDumpFailures.dat: failure records appear
// in BOTH files (the dedicated failure file remains the canonical
// operator-visible record paired with the Redfish EventLog Entry; this
// file is the unified success+failure index).
message fdr_device_dump_record {
  enum Status {
    UNKNOWN = 0;
    SUCCESS = 1;
    FAILED  = 2;
  }
  uint64 EventTimeStamp      = 1;   // Triggering XID Entry timestamp; matches fdr_book_of_errors.ErrorOccurTimeStamp
  uint64 CompletionTimeStamp = 2;   // When the dump finished (SUCCESS) or terminal failure was recorded (FAILED)
  string ProfileName         = 3;   // PPF DumpProfile name (e.g. "GpuDump")
  string DeviceId            = 4;   // Component ID (e.g. "HGX_GPU_0")
  uint32 EventCode           = 5;   // Triggering XID/code (e.g. 119)
  Status status              = 6;   // SUCCESS or FAILED
  string FilePath            = 7;   // Path relative to LogsBasePath, e.g. "BootCount_17_.../GPU.HGX_GPU_0.gpu_dump_<ts>.dat" (empty for FAILED)
  uint64 SizeBytes           = 8;   // Stored payload size (0 for FAILED). uint64 to future-proof for larger dump types.
  uint32 AttemptCount        = 9;   // 1-4 — attempt that succeeded (SUCCESS) or final attempt count (FAILED)
  string FailureStage        = 10;  // Empty for SUCCESS; same vocabulary as fdr_device_dump_failure.FailureStage
  string ErrorDetail         = 11;  // Empty for SUCCESS; same vocabulary as fdr_device_dump_failure.ErrorDetail
  string BootId              = 12;  // Matches fdr_boot_event.BootId
}

// Generic wrapper for all device dump types (GpuDump, PmuDump, NVLinkDump, etc.)
// ProfileName carries the PPF DumpProfile name and is the dump-type identifier.
// RawDump is an opaque binary blob; decoding is owned by the device-firmware
// team (e.g. OOBHUB for GPU dumps), not FDR.
message fdr_device_dump {
  reserved 2;                      // formerly `string DumpType` — dropped (always equal to ProfileName); see commit history
  uint64 EventTimeStamp = 1;       // Timestamp when triggering event was detected
  uint32 EventCode = 3;            // Event code that triggered collection (e.g., XID 119)
  string EventMessage = 4;         // Event description string
  string DeviceId = 5;             // Device identifier (e.g., "HGX_GPU_0")
  string DeviceType = 6;           // Device type (e.g., "GPU", "NVSwitch", "FPGA")
  string BootId = 7;               // Boot ID when dump was collected (matches fdr_boot_event.BootId type)
  uint32 DumpVersion = 8;          // Dump format version (source-defined)
  bytes RawDump = 9;               // Raw dump payload (opaque binary blob)
  uint64 CollectionTimeStamp = 10; // When FDR stored the dump
  string CollectionStatus = 11;    // Collection status (e.g., "SUCCESS", "EMPTY", "OVERSIZED")
  string ProfileName = 12;         // DumpProfile name from PPF (e.g., "GpuDump") — IS the dump-type identifier
}
