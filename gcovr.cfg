# gcovr configuration file for nvidia-fdr coverage reporting
# Usage: gcovr --config gcovr.cfg

# Exclude test code from coverage computation
exclude = .*tests/.*\.[ch]pp

# Exclude meson subprojects (sdbusplus, protobuf, yaml-cpp, etc.)
exclude = .*subprojects.*

# Exclude protobuf generated code
exclude = .*\.pb\.(cc|h)

# Branch coverage options
exclude-throw-branches = yes
exclude-unreachable-branches = yes
decisions = yes
