            Interface: "xyz.openbmc_project.Sensor.Value"
            Property: "Value"  

      <<: *compaction-definition-sensors

    - ID: Status
      InfoList:
        - ID: ALT-PRESSURE
          <<: *baseboardDefaults
          DataType: Uint64
          DbusParams:
