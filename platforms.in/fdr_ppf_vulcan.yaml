PCIeSwitch: &pcieswitch
  Params:
    - name: pcieswitch
      values: 0
  InfoGroups:
    - ID: Config
      InfoList:
        - &pcieswitchDefaults
          ID: FW-VER
          FetchPolicy: Periodic
          FetchFreqSecs: 3600  
          FetchMethod: DBUS
          StorePolicy: OnChange
          DataType: string
          DbusParams:
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/software/HGX_FW_PCIeSwitch_$pcieswitchid"
            Interface: "xyz.openbmc_project.Software.Version"
            Property: "Version"

BOOTEVENT: &bootevent
  InfoGroups:
    - ID: bootevent
      InfoList:
        - ID: BootEventLog
          FetchPolicy: OnBoot
          FetchFreqSecs: 5
          StorePolicy: EveryFetch
          CommandParams: # TODO: need to fix the absolute path of this script..till then refer locally via relative path
            Command: "./tools/FdrBootCounter.sh $logbasepath; echo ';'; uptime -s"

Sections:
  - ID: BOOT              # which are needed to be executed only at every FDR start/boot instance
    Components:
      - ID: BOOTEVENT
        <<: *bootevent
        Params:           #and change parameter values
          - name: logbasepath
            value: *LogsBasePath
  - ID: GPU
    Components:
