FingerPrint:
  Checks:   # all conditions needs to be satisified
      - "grep -q -i openbmc-phosphor /etc/os-release"
      - "grep -q -i hgx /etc/os-release"
      - "grep -q -i VULCAN /etc/os-release"

GeneralConfig:
  LogsFormat: JSON  #Choices=JSON|BINARY|DB
  #DatabaseName: "Database.db"   #Only used if logs format is DB
  LogsBasePath: &LogsBasePath
    - "/home/root/"
  DefaultCompactionSensors: &compaction-definition-sensors
    CompactionFreqSecs: 60 #1 min
    CompactionPolicy: Periodic
    CompactionMethod: Average

GPU: &gpu
  Params:
    - name: gpuid
      value: 1
  InfoGroups: #A Logfile shall be created for each item in this list
    - ID: Inventory #This eg. will create $LogsBasePath/GPU/GPU0/Inventory.log
      InfoList:
        - &defaults
          ID: VENDOR #Name of the this info/parameter/metric inside the log file
          DataType: string
          FetchPolicy: Periodic       #Choices=Periodic|OnEvent
          FetchMethod: Command        #Choices=Command|DBUS|SysFS|IPMI|RF etc.
          FetchFreqSecs: 3600         #Sampling freq in seconds    #1 hour
          StorePolicy: OnChange       #Choices=Periodic|OnChange|OnEvent
          FetchMethod: DBUS
          DbusParams: 
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/inventory/system/chassis/HGX_Chassis_0"
            Interface: "xyz.openbmc_project.Inventory.Decorator.Asset"
            Property: "Manufacturer"

        - ID: BRD-PART-NUM
          <<: *defaults
          DbusParams: 
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/inventory/system/processors/GPU_SXM_$gpuid"
            Interface: "xyz.openbmc_project.Inventory.Decorator.Asset"
            Property: "PartNumber"

        - ID: SERIAL
          <<: *defaults
          DbusParams: 
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/inventory/system/chassis/HGX_Chassis_0"
            Interface: "xyz.openbmc_project.Inventory.Decorator.Asset"
            Property: "SerialNumber"

  
        - ID: PART-NUM[0]
          <<: *defaults
          DbusParams: 
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/inventory/system/chassis/HGX_Chassis_0/Assembly0"
            Interface: "xyz.openbmc_project.Inventory.Decorator.Asset"
            Property: "PartNumber"

        - ID: PART-NUM[1]
