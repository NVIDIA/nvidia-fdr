HSC: &hsc
  Params:
    - name: hsc
      values: 0
  InfoGroups:
    - ID: Sensor.Thermal
      InfoList:
        - &hscDefaults
          ID: TEMP-GB-HSC
          FetchPolicy: Periodic
          FetchFreqSecs: 1
          FetchMethod: DBUS
          StorePolicy: Periodic
          StoreFreqSecs: 3600
          DataType: Uint64
          DbusParams:
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/sensors/temperature/HGX_Chassis_0_HSC_$hscid_Temp_0"
            Interface: "xyz.openbmc_project.Sensor.Value"
            Property: "Value" 
            
      <<: *compaction-definition-sensors

    - ID: Sensor.Power
      InfoList:
        - ID: PWR-GB-HSC
          <<: *hscDefaults
          FetchFreqSecs: 1
          DbusParams:
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/sensors/power/HGX_Chassis_0_HSC_$hscid_Power_0"
            Interface: "xyz.openbmc_project.Sensor.Value"
            Property: "Value" 

      <<: *compaction-definition-sensors

    #TODO
    - ID: Error
      InfoList:
        - &hscDefaultsError
          ID: HSC-FAULT-REG-ARG80
          FetchFreqSecs: 3600
          FetchPolicy: Periodic
          StorePolicy: OnChange
          DataType: string
          FetchMethod: DBUS-DGD
          DbusDGDParams:
            Service: "xyz.openbmc_project.Logging"
            ObjectPath: "/xyz/openbmc_project/logging"
            Interface: "xyz.openbmc_project.GpuMgr.Server"
            DevId: 1
            Property: "hsc.device.alert"


