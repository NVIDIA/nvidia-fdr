            ObjectPath: "/xyz/openbmc_project/software/HGX_FW_PCIeSwitch_$pcieswitchid"
            Interface: "xyz.openbmc_project.Software.Version"
            Property: "Version"

    - ID: Status
      InfoList:
        - ID: HEALTH
          <<: *fpgaDefaults
          FetchFreqSecs: 3600
          StorePolicy: EveryFetch
          DbusParams:
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/inventory/system/chassis/HGX_PCIeSwitch_$pcieswitchid"
            Interface: "xyz.openbmc_project.State.Decorator.Health"
            Property: "Health"


