FingerPrint:
  Checks:   # all conditions needs to be satisfied
    - "grep -q -i Ubuntu /etc/os-release"

GeneralConfig:
  LogsFormat: JSON  #Choices=JSON|BINARY|DB
  #DatabaseName: "Database.db"   #Only used if logs format is DB
  LogsBasePath: &LogsBasePath
    - "/tmp/fdr/"
  # The maximum size of the log file, it will be rotated once its size exceed this value
  # Default: 1048576(1MB)
  LoggingFileMaxSize: 1048576
  # How many log files to keep
  # Default: 3
  LoggingFileNumber: 3
  # The logging level, valid options are:
  #   trace, debug, info, warn, err, critical, off
  # Default: info
  LoggingLevel: info
  # Uncomment the following if redfish related support is required.
  # RedfishSchema examples are: http://192.168.1.31, or https://192.168.1.31.
  # If the Redfish server require authentication,
  #   set RedfishUser and  RedfishPassword as well
  #RedfishSchema: 
  #RedfishUser: 
  #RedfishPassword:  
  CompactionWindowSecs: 60 # 604800 # 1 week, every week new directory is created
  CompactionSubWindowSecs: 10 #7200 # 2 hours, every 2 hours stats are created
  HiFiDataPreserveTimeSecs: 20 #14400 # 4 hours, <-4 hours ---Error--- +4 hours> worth of entires
  DefaultCompactionSensors: &compaction-definition-sensors
    RecordRetentionPolicy: Recreate
    CompactionMethod: Average

GPU: &gpu
  Params:
    - name: gpuid
      value: 0
  InfoGroups:                         #A Logfile shall be created for each item in this list
    - ID: Inventory                   #This for eg. will create $LogsBasePath/GPU/GPU0/Inventory.log
      InfoList:
        - &defaults
          ID: Model                   #Name of the this info/parameter/metric inside the log file
          ParamID: 0                  #Must be a unique number for each parameter class. Please DON"T change it once assigned, and pick the next available number while adding a new parameter.
          DataType: string
          FetchPolicy: Periodic       #Choices=Periodic|OnEvent
          FetchMethod: Command        #Choices=Command|DBUS|SysFS|IPMI|RF etc.
          FetchFreqSecs: 5            #Sampling freq in seconds
          StorePolicy: OnChange       #Choices=Periodic|OnChange|OnEvent
          CommandParams:              #applicable only when FetchMethod=Command
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=name"
        - ID: Serial
          <<: *defaults
          ParamID: 1
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=serial"
        - ID: UUID
          <<: *defaults
          ParamID: 2
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=uuid"
    - ID: Versions
      InfoList:
        - ID: Driver
          <<: *defaults
          ParamID: 0
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=driver_version"
        - ID: VBIOS
          <<: *defaults
          ParamID: 1
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=vbios_version"
        - ID: Inforom
          <<: *defaults
          ParamID: 2
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=inforom.oem,inforom.ecc,inforom.pwr"
    - ID: Config
      InfoList:
        - ID: PowerManagementEnabled
          <<: *defaults
          ParamID: 1
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=power.management"
        - ID: MIGMode
          <<: *defaults
          ParamID: 2
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=mig.mode.current"
        - ID: UserConfiguredGraphicsClock
          <<: *defaults
          ParamID: 3
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=clocks.applications.gr"
        - ID: UserConfiguredMemoryClock
          <<: *defaults
          ParamID: 4
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=clocks.applications.mem"
    - ID: Errors
      InfoList:
        - ID: L1CacheErrorsCorrected
          <<: *defaults
          ParamID: 0
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=ecc.errors.corrected.volatile.l1_cache"
        - ID: L2CacheErrorsCorrected
          <<: *defaults
          ParamID: 1
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=ecc.errors.corrected.volatile.l2_cache"
    - ID: Sensor.Thermal
      InfoList:
        - ID: GPUTemp
          <<: *defaults
          ParamID: 0
          StorePolicy: EveryFetch
          DataType: Uint64
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=temperature.gpu"
        - ID: MemTemp
          <<: *defaults
          ParamID: 1
          StorePolicy: EveryFetch
          DataType: Uint64
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=temperature.memory"
      <<: *compaction-definition-sensors
    - ID: Sensor.Clock
      InfoList:
        - ID: SM
          <<: *defaults
          ParamID: 0
          StorePolicy: EveryFetch
          DataType: Uint64
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=clocks.current.sm"
        - ID: Memory
          <<: *defaults
          ParamID: 1
          StorePolicy: EveryFetch
          DataType: Uint64
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=clocks.current.memory"
        - ID: Graphics
          <<: *defaults
          ParamID: 2
          StorePolicy: EveryFetch
          DataType: Uint64
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=clocks.current.graphics"
        - ID: Video
          <<: *defaults
          ParamID: 3
          StorePolicy: EveryFetch
          DataType: Uint64
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=clocks.current.video"
      <<: *compaction-definition-sensors
    - ID: Sensor.Power
      InfoList:
        - ID: Power
          <<: *defaults
          ParamID: 0
          StorePolicy: EveryFetch
          DataType: Uint64
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=power.draw"
      <<: *compaction-definition-sensors

NIC: &nic
  Params:
    - name: nicid
      value: 0
  InfoGroups:
    - ID: Stats
      InfoList:
        - ID: RxBytes
          ParamID: 0
          DataType: Uint64
          FetchPolicy: Periodic
          FetchFreqSecs: 5
          FetchMethod: DBUS
          StorePolicy: EveryFetch
          DbusParams:
            Service: "org.freedesktop.NetworkManager"
            ObjectPath: "/org/freedesktop/NetworkManager/Devices/$nicid"
            Interface: "org.freedesktop.NetworkManager.Device.Statistics"
            Property: "RxBytes"
      <<: *compaction-definition-sensors

BOOTEVENT: &bootevent
  InfoGroups:
    - ID: BootEvent
      InfoList:
        - ID: BootEventLog
          <<: *defaults
          ParamID: 0
          FetchPolicy: OnBoot
          StorePolicy: EveryFetch
          CommandParams:
            Command: "cat $logbasepath/Bookkeeper/BootCount.txt; echo ';'; uptime -s"
      RecordRetentionPolicy: AfterBootDelete

Sections:
  - ID: BOOT              # which are needed to be executed only at every FDR start/boot instance
    Components:
      - ID: BOOTEVENT
        <<: *bootevent
        Params:           #and change parameter values
          - name: logbasepath
            value: *LogsBasePath

  - ID: GPU
    Components:
      - ID: GPU0
        <<: *gpu          #Inherit all definitions from template
        Params:           #and change parameter values
          - name: gpuid
            value: 0
      - ID: GPU1
        <<: *gpu
        Params:
          - name: gpuid
            value: 1
      - ID: GPU2
        <<: *gpu
        Params:
          - name: gpuid
            value: 2
      - ID: GPU3
        <<: *gpu
        Params:
          - name: gpuid
            value: 3
  - ID: NIC
    Components:
      - ID: NIC1
        <<: *nic
        Params:
          - name: nicid
            value: 1

