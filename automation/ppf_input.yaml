platform:
  name: gb200nvl-hmc
  fingerprint:
    - "grep -q -i openbmc-phosphor /etc/os-release"
    - "grep -q -i gb200nvl-hmc /etc/os-release"
  processors: accelerator
  # Hard-coded column index to use for "Yes" values (Column 25 = "Applicable for GB300 NVL HMC")
  applicable_column_index: 24
  # Column index to use for values in dbus-expansion.csv 
  expansion_column_index: 1
  # Column index to use for values in 
  shmem_column_index: 16
  dbus_column_index: 15



# Common configuration for all platforms
general_config:
  LogsFormat: BINARY
  LogsBasePath: &LogsBasePath
    - "/var/emmc/fdr/"
  PartitionThresoldCheckMB: 1536
  CompactionWindowSecs: 86400
  CompactionSubWindowSecs: 1800
  HiFiDataPreserveTimeSecs: 300
  DefaultCompactionSensors: &compaction-definition-sensors
    RecordRetentionPolicy: Recreate
    CompactionMethod: Average
  Events:
    ObjectPath: /xyz/openbmc_project/logging
    Interface: org.freedesktop.DBus.ObjectManager
    Member: InterfacesAdded
  
# Precondition checks
preconditions:
  Threshold: 300
  Checks:
  - ID: CheckDumpDirMount
    CommandParams:
      Command: df $logbasepath | grep '/dev/mmcblk'
    Params:
      name: logbasepath
      value: *LogsBasePath
    CommandRetryPolicy: No
    ExitOnFailure: Yes

  - ID: CheckHmcWaitReady
    CommandParams:
      Command: busctl get-property xyz.openbmc_project.State.ConfigurableStateManager /xyz/openbmc_project/state/configurableStateManager/Manager xyz.openbmc_project.State.FeatureReady State | grep -i -q xyz.openbmc_project.State.FeatureReady.States.Enabled
    CommandRetryPolicy: Yes
    ExitOnFailure: No