FingerPrint:
  Checks:
  - grep -q -i openbmc-phosphor /etc/os-release
  - grep -q -i gb200nvl-hmc /etc/os-release

GeneralConfig:
  LogsFormat: BINARY
  LogsBasePath: &LogsBasePath
    - /var/emmc/fdr/
  PartitionThresoldCheckMB: 1536 # emmc Partition threshold size check [if available space < 1.5 GB, then exit FDR]
  CompactionWindowSecs: 86400 # 1 day, every day new directory is created
  CompactionSubWindowSecs: 1800 # .5 hours, every 30 minutes stats are appended
  HiFiDataPreserveTimeSecs: 300 # 5 minutes, <-5 minutes ---Error--- +5 minutes> so total 10 minutes worth of entires
  DefaultCompactionSensors: &compaction-definition-sensors
    RecordRetentionPolicy: Recreate
    CompactionMethod: Average
  Events:
    ObjectPath: /xyz/openbmc_project/logging
    Interface: org.freedesktop.DBus.ObjectManager
    Member: InterfacesAdded

Preconditions:
  Threshold: 300
  Checks:
  - ID: CheckDumpDirMount
    CommandParams:
      Command: df $logbasepath | grep '/dev/mmcblk'
    Params:
      name: logbasepath
      value:
      - /var/emmc/fdr/
    CommandRetryPolicy: false
    ExitOnFailure: true
  - ID: CheckHmcWaitReady
    CommandParams:
      Command: busctl get-property xyz.openbmc_project.State.ConfigurableStateManager
        /xyz/openbmc_project/state/configurableStateManager/Manager xyz.openbmc_project.State.FeatureReady
        State | grep -i -q xyz.openbmc_project.State.FeatureReady.States.Enabled
    CommandRetryPolicy: true
    ExitOnFailure: false

