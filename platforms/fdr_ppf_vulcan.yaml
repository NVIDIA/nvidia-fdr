FingerPrint:
  Checks:   # all conditions needs to be satisfied
      - "grep -q -i openbmc-phosphor /etc/os-release"
      - "grep -q -i hgx /etc/os-release"
      - "grep -q -i VULCAN /etc/os-release"

GeneralConfig:
  LogsFormat: BINARY  #Choices=JSON|BINARY
  LogsBasePath: &LogsBasePath
    - "/var/emmc/fdr/"
  PartitionThresoldCheckMB: 1536 # emmc Partition threshold size check [if available space < 1.5 GB, then exit FDR]
  CompactionWindowSecs: 86400 # 1 day, every day new directory is created
  CompactionSubWindowSecs: 1800 # .5 hours, every 30 minutes stats are appended
  HiFiDataPreserveTimeSecs: 300 # 5 minutes, <-5 minutes ---Error--- +5 minutes> so total 10 minutes worth of entires
  DefaultCompactionSensors: &compaction-definition-sensors
    RecordRetentionPolicy: Recreate
    CompactionMethod: Average
  # Config params for storing AML events on OpenBMC platforms
  Events:
    ObjectPath: "/xyz/openbmc_project/logging"
    Interface: "org.freedesktop.DBus.ObjectManager"
    Member: "InterfacesAdded"

Preconditions:
  Threshold: 300 # In seconds, Each precondition should be tested till threshold limit
  Checks: # Platform conditions to be prechecked before running FDR
    - ID: CheckDumpDirMount
      CommandParams:
        Command: "df $logbasepath | grep '/dev/mmcblk'"
      Params:
        name: logbasepath
        value: *LogsBasePath
      CommandRetryPolicy: No
      ExitOnFailure: Yes
    - ID: CheckHmcWaitReady
      CommandParams:
        Command: "busctl get-property xyz.openbmc_project.GpuMgr /xyz/openbmc_project/inventory/system/HGX_BMC_0 xyz.openbmc_project.State.Decorator.OperationalStatus State | grep -i -q xyz.openbmc_project.State.Decorator.OperationalStatus.StateType.Enabled"
      CommandRetryPolicy: Yes
      ExitOnFailure: No

GPU: &gpu
