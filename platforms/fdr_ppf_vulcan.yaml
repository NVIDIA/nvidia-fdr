PCIeSwitch: &pcieswitch
  Params:
    - name: pcieswitch
      values: 0
  InfoGroups:
    - ID: Config
      InfoList:
        - &pcieswitch-config-defaults
          ID: FW-VER
          ParamID: 0
          FetchFreqSecs: 3600  
          StoreFreqSecs: 3600
          FetchMethod: DBUS
          StorePolicy: OnChange
          FetchType: Subscribe
          DataType: string
          DbusParams:
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/software/HGX_FW_PCIeSwitch_$pcieswitchid"
            Interface: "xyz.openbmc_project.Software.Version"
            Property: "Version"

    - ID: Status
      InfoList:
        - &pcieswitch-status-defaults
          ID: HEALTH
          ParamID: 0
          FetchFreqSecs: 3600  
          StoreFreqSecs: 3600
          FetchMethod: DBUS
          StorePolicy: EveryFetch
          FetchType: Subscribe
          DataType: string
          DbusParams:
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/inventory/system/chassis/HGX_PCIeSwitch_$pcieswitchid"
            Interface: "xyz.openbmc_project.State.Decorator.Health"
            Property: "Health"

BOOTEVENT: &bootevent
  InfoGroups:
    - ID: BootEvent
      InfoList:
        - ID: BootEventLog
          ParamID: 0
          DataType: string
          StorePolicy: EveryFetch
          FetchMethod: Command
          CommandParams:
            Command: "cat $logbasepath/Bookkeeper/BootCount.txt; echo ';'; uptime -s"
      RecordRetentionPolicy: AfterBootDelete

Sections:
  - ID: BOOT              # which are needed to be executed only at every FDR start/boot instance
    Components:
      - ID: BOOTEVENT
        <<: *bootevent
        Params:           #and change parameter values
          - name: logbasepath
            value: *LogsBasePath
  - ID: GPU
    Components:
      - ID: GPU1
        <<: *gpu
        Params:
          - name: gpuid
            value: 1 
      - ID: GPU2
        <<: *gpu
        Params:
          - name: gpuid
            value: 2
      - ID: GPU3
        <<: *gpu
        Params:
