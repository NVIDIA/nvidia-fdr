FingerPrint:
  Checks:
    - grep -q -i openbmc-phosphor /etc/os-release
    # Need to uncomment this when we have gh200  in /etc/os-release.
    #- grep -q -i gh200 /etc/os-release
    
GeneralConfig:
  LogsFormat: BINARY
  LogsBasePath: &LogsBasePath
    - /var/emmc/fdr/
  PartitionThresoldCheckMB: 1536
  CompactionWindowSecs: 86400
  CompactionSubWindowSecs: 1800
  HiFiDataPreserveTimeSecs: 300
  DefaultCompactionSensors:
    RecordRetentionPolicy: Recreate
    CompactionMethod: Average
  Events:
    ObjectPath: /xyz/openbmc_project/logging
    Interface: org.freedesktop.DBus.ObjectManager
    Member: InterfacesAdded
  Threshold: 300
  Checks:
    - ID: CheckDumpDirMount
      CommandParams:
        Command: df $logbasepath | grep '/dev/mmcblk'
      Params:
        name: logbasepath
        value:
          - *LogsBasePath
      CommandRetryPolicy: No
      ExitOnFailure: Yes

GPU: &gpu
  Params:
    - name: gpuid
      value: 0
  InfoGroups:
    - ID: Config
      InfoList:
        - &gpu-config-defaults
          ID: ENFORCED-CLK-LIMIT-MAX
          ParamID: 1
          DataType: Integer
          FetchMethod: DBUS
          FetchFreqSecs: 3600
          StorePolicy: OnChange
          StoreFreqSecs: 3600
          FetchType: Poll
          DbusParams: 
            Service: "xyz.openbmc_project.GpuMgr"
            #ObjectPath: "/xyz/openbmc_project/inventory/system/processors/GPU_$gpuid"
            ObjectPath: "/xyz/openbmc_project/inventory/system/processors/GPU_$gpuid"
            #No SXM 
            Interface: "xyz.openbmc_project.Inventory.Item.Cpu.OperatingConfig"
            Property: "SpeedConfig"

        - ID: DRVR-VER
