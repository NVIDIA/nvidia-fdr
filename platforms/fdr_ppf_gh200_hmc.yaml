          ParamID: 2
          DataType: Text
          DbusParams: 
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/inventory_software/HGX_Driver_GPU_$gpuid"
            #No SXM
