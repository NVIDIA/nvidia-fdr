FingerPrint:
  Checks:
  - grep -q -i openbmc-phosphor /etc/os-release
  - grep -q -i vr-nvl144-hmc /etc/os-release
GeneralConfig:
  CompactionSubWindowSecs: 1800
  CompactionWindowSecs: 86400
  DefaultCompactionSensors:
    CompactionMethod: Average
    RecordRetentionPolicy: Recreate
  Events:
    Interface: org.freedesktop.DBus.ObjectManager
    Member: InterfacesAdded
    ObjectPath: /xyz/openbmc_project/logging
  HiFiDataPreserveTimeSecs: 300
  LogsBasePath:
  - /var/emmc/fdr/
  LogsFormat: BINARY
  PartitionThresoldCheckMB: 1024
Preconditions:
  Checks:
  - CommandParams:
      Command: df $logbasepath | grep '/dev/mmcblk'
    CommandRetryPolicy: false
    ExitOnFailure: true
    ID: CheckDumpDirMount
    Params:
      name: logbasepath
      value:
      - /var/emmc/fdr/
  - CommandParams:
      Command: busctl get-property xyz.openbmc_project.State.BMC /xyz/openbmc_project/state/bmc0
        xyz.openbmc_project.State.BMC CurrentBMCState | grep -q 'BMCState.Ready'
    CommandRetryPolicy: true
    ExitOnFailure: false
    ID: CheckHmcWaitReady
  Threshold: 300
