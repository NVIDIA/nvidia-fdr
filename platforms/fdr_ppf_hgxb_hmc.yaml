FingerPrint:
  Checks:
    - grep -q -i openbmc-phosphor /etc/os-release
    - grep -q -i hgxb /etc/os-release

GeneralConfig:
  LogsFormat: BINARY
  LogsBasePath: &LogsBasePath
    - /var/emmc/fdr/
  PartitionThresoldCheckMB: 1536
  CompactionWindowSecs: 86400
  CompactionSubWindowSecs: 1800
  HiFiDataPreserveTimeSecs: 300
  DefaultCompactionSensors:
    RecordRetentionPolicy: Recreate
    CompactionMethod: Average
  Events:
    ObjectPath: /xyz/openbmc_project/logging
    Interface: org.freedesktop.DBus.ObjectManager
    Member: InterfacesAdded
  Threshold: 300
  Checks:
    - ID: CheckDumpDirMount
      CommandParams:
        Command: df $logbasepath | grep '/dev/mmcblk'
      Params:
        name: logbasepath
        value:
          - *LogsBasePath
      CommandRetryPolicy: No
      ExitOnFailure: Yes
    - ID: CheckHmcWaitReady
      CommandParams:
        Command:
          busctl get-property xyz.openbmc_project.GpuMgr /xyz/openbmc_project/inventory/system/HGX_BMC_0
          xyz.openbmc_project.State.Decorator.OperationalStatus State | grep -i -q xyz.openbmc_project.State.Decorator.OperationalStatus.StateType.Enabled
      CommandRetryPolicy: Yes
      ExitOnFailure: No


