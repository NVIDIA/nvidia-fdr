GeneralConfig:
  LogsBasePath: "/tmp/logs/fdr"
  LogsFormat: DB  #Choices=JSON|Binary|DB
  DatabaseName: "Database.db"

GPU: &gpu
  Params:
    - name: gpuid
      value: 0
  InfoGroups:                         #A Logfile shall be created for each item in this list
    - ID: Inventory                   #This for eg. will create $LogsBasePath/GPU/GPU0/Inventory.log
      InfoList:
        - &defaults
          ID: Model                   #Name of the this info/parameter/metric inside the log file
          FetchPolicy: Periodic       #Choices=Periodic|OnEvent
          FetchMethod: Command        #Choices=Command|DBUS|SysFS|IPMI|RF etc.
          FetchFreqSecs: 5            #Sampling freq in seconds
          StorePolicy: OnChange       #Choices=Periodic|OnChange|OnEvent
          CommandParams:              #applicable only when FetchMethod=Command
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=name"
        - ID: Serial
          <<: *defaults
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=serial"
        - ID: UUID
          <<: *defaults
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=uuid"
    - ID: Versions
      InfoList:
        - ID: Driver
          <<: *defaults
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=driver_version"
        - ID: VBIOS
          <<: *defaults
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=vbios_version"
        - ID: Inforom
          <<: *defaults
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=inforom.oem,inforom.ecc,inforom.pwr"
    - ID: Config
      InfoList:
        - ID: PowerManagementEnabled
          <<: *defaults
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=power.management"
        - ID: MIGMode
          <<: *defaults
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=mig.mode.current"
        - ID: UserConfiguredGraphicsClock
          <<: *defaults
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=clocks.applications.gr"
        - ID: UserConfiguredMemoryClock
          <<: *defaults
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=clocks.applications.mem"
    - ID: Errors
      InfoList:
        - ID: L1CacheErrorsCorrected
          <<: *defaults
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=ecc.errors.corrected.volatile.l1_cache"
        - ID: L2CacheErrorsCorrected
          <<: *defaults
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=ecc.errors.corrected.volatile.l2_cache"
    - ID: Sensors
      InfoList:
        - ID: GPUTemp
          <<: *defaults
          StorePolicy: EveryFetch
          DataType: Uint64
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=temperature.gpu"
        - ID: MemTemp
          <<: *defaults
          StorePolicy: EveryFetch
          DataType: Uint64
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=temperature.gpu"
      CompactionPolicy: Periodic
      CompactionFreqSecs: 60
      CompactionMethod: Average

NIC: &nic
  Params:
    - name: nicid
      value: 0
  InfoGroups:
    - ID: Stats
      InfoList:
        - ID: RxBytes
          DataType: Uint64
          FetchPolicy: Periodic
          FetchFreqSecs: 5
          FetchMethod: DBUS
          StorePolicy: EveryFetch
          DbusParams:
            Service: "org.freedesktop.NetworkManager"
            ObjectPath: "/org/freedesktop/NetworkManager/Devices/$nicid"
            Interface: "org.freedesktop.NetworkManager.Device.Statistics"
            Property: "RxBytes"
      CompactionPolicy: Periodic
      CompactionFreqSecs: 20
      CompactionMethod: Average

NVSwitch: &nvswitch
  Params:
    - name: switchid
      values: 1
  InfoGroups:
    - ID: Config
      InfoList:
        - &switchDefaults
          ID: FirmwareVersion
          FetchPolicy: Periodic
          FetchFreqSecs: 60  #Temp freq
          FetchMethod: DBUS
          StorePolicy: OnChange
          DbusParams:
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/software/NVSwitch$switchidFirmware"
            Interface: "xyz.openbmc_project.Software.Version"
            Property: "Version"
        - ID: ShutdownTemperature
          <<: *switchDefaults
          DataType: Uint64
          FetchFreqSecs: 5
          DbusParams:
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/sensor/temperature/TEMP_GB_NVS$switchid" #Check this
            Interface: "xyz.openbmc_project.Sensor.Threshold.HardShutdown"
            Property: "HardShutdownHigh"
        - ID: MaximumOperatingTemperature
          <<: *switchDefaults
          DataType: Uint64
          FetchFreqSecs: 5
          DbusParams:
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/sensor/temperature/TEMP_GB_NVS$switchid" #Check this
            Interface: "xyz.openbmc_project.Sensor.Value"
            Property: "MaxAllowableValue"
        - ID: InfoROMVersion
          <<: *switchDefaults
          DbusParams:
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/software/NVSwitch$switchidInfoROM"
            Interface: "xyz.openbmc_project.Software.Version"
            Property: "Version"
    - ID: Error
      InfoList:
        - &ErrorDefaults
          ID: ECCCorrectable
          DataType: Uint64
          FetchPolicy: Periodic
          FetchFreqSecs: 5
          FetchMethod: DBUS
          StorePolicy: OnChange
          DbusParams:
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/inventory/system/NVLinkFabric/Switches/NVSwitch$switchid"
            Interface: "xyz.openbmc_project.Memory.MemoryECC"
            Property: "ceCount"
        - ID: ECCUncorrectable
          <<: *ErrorDefaults
          DbusParams:
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/inventory/system/NVLinkFabric/Switches/NVSwitch$switchid"
            Interface: "xyz.openbmc_project.Memory.MemoryECC"
            Property: "ueCount"
        - ID: NonFatal
          <<: *ErrorDefaults
          DbusParams:
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/inventory/system/NVLinkFabric/Switches/NVSwitch$switchid"
            Interface: "xyz.openbmc_project.PCIe.PCIeECC"
            Property: "nonfeCount"
        - ID: Fatal
          <<: *ErrorDefaults
          DbusParams:
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/inventory/system/NVLinkFabric/Switches/NVSwitch$switchid"
            Interface: "xyz.openbmc_project.PCIe.PCIeECC"
            Property: "feCount"
        - ID: Correctable
          <<: *ErrorDefaults
          DbusParams:
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/inventory/system/NVLinkFabric/Switches/NVSwitch$switchid"
            Interface: "xyz.openbmc_project.PCIe.PCIeECC"
            Property: "ceCount"
        - ID: Replay
          <<: *ErrorDefaults
          DbusParams:
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/inventory/system/NVLinkFabric/Switches/NVSwitch$switchid"
            Interface: "xyz.openbmc_project.PCIe.PCIeECC"
            Property: "ReplayCount"
        - ID: ReplayRollover
          <<: *ErrorDefaults
          DbusParams:
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/inventory/system/NVLinkFabric/Switches/NVSwitch$switchid"
            Interface: "xyz.openbmc_project.PCIe.PCIeECC"
            Property: "ReplayRolloverCount"
        - ID: NAKsSent
          <<: *ErrorDefaults
          DbusParams:
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/inventory/system/NVLinkFabric/Switches/NVSwitch$switchid"
            Interface: "xyz.openbmc_project.PCIe.PCIeECC"
            Property: "NAKSentCount"
        - ID: NAKsReceived
          <<: *ErrorDefaults
          DbusParams:
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/inventory/system/NVLinkFabric/Switches/NVSwitch$switchid"
            Interface: "xyz.openbmc_project.PCIe.PCIeECC"
            Property: "NAKReceivedCount"
    - ID: Inventory
      InfoList:
        - ID: BoardPartNumber
          <<: *switchDefaults
          DbusParams:
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/inventory/system/chassis/NVSwitch$switchid"
            Interface: "xyz.openbmc_project.Inventory.Decorator.Asset"
            Property: "PartNumber"
        - ID: SerialNumber
          <<: *switchDefaults
          DbusParams:
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/inventory/system/chassis/NVSwitch$switchid"
            Interface: "xyz.openbmc_project.Inventory.Decorator.Asset"
            Property: "SerialNumber"
        - ID: GUID
          <<: *switchDefaults
          DbusParams:
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/inventory/system/chassis/NVSwitch$switchid"
            Interface: "xyz.openbmc_project.Common.UUID"
            Property: "UUID"
    - ID: Status
      InfoList:
        - ID: ManagerState
          <<: *switchDefaults
          DataType: Uint64
          FetchFreqSecs: 30
          DbusParams:
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/inventory/system/managers/FabricManager"
            Interface: "xyz.openbmc_project.State.Decorator.OperationalStatus"
            Property: "State"
    - ID: Sensor
      InfoList:
        - ID: TEMP_GB_NVS
          DataType: Uint64
          FetchPolicy: Periodic
          FetchFreqSecs: 10
          FetchMethod: DBUS
          StorePolicy: Periodic
          StoreFreqSecs: 3600
          DbusParams:
            Service: "xyz.openbmc_project.GpuMgr"
            ObjectPath: "/xyz/openbmc_project/sensors/temperature/TEMP_GB_NVS$switchid"
            Interface: "xyz.openbmc_project.Sensor.Value"
            Property: "Value"


Sections:
  - ID: GPU
    Components:
      - ID: GPU0
        <<: *gpu          #Inherit all definitions from template
        Params:           #and change parameter values
          - name: gpuid
            value: 0
      - ID: GPU1
        <<: *gpu
        Params:
          - name: gpuid
            value: 1
      - ID: GPU2
        <<: *gpu
        Params:
          - name: gpuid
            value: 2
      - ID: GPU3
        <<: *gpu
        Params:
          - name: gpuid
            value: 3
  - ID: NIC
    Components:
      - ID: NIC1
        <<: *nic
        Params:
          - name: nicid
            value: 1
  - ID: NVSwitch
    Components:
      - ID: NVSwitch0
        <<: *nvswitch
        Params:
          - name: switchid
            value: 0
      - ID: NVSwitch1
        <<: *nvswitch
        Params:
          - name: switchid
            value: 1
      - ID: NVSwitch2
        <<: *nvswitch
        Params:
          - name: switchid
            value: 2
      - ID: NVSwitch3
        <<: *nvswitch
        Params:
          - name: switchid
            value: 3

