GeneralConfig:
  LogsBasePath: "/tmp/logs/fdr"
  LogsFormat: JSON  #Choices=JSON|Binary

GPU: &gpu
  Params:
    - name: gpuid
      value: 0
  InfoGroups:                         #A Logfile shall be created for each item in this list
    - ID: Inventory                   #This for eg. will create $LogsBasePath/GPU/GPU0/Inventory.log
      InfoList:
        - &defaults
          ID: Model                   #Name of the this info/parameter/metric inside the log file
          FetchPolicy: Periodic       #Choices=Periodic|OnEvent
          FetchMethod: Command        #Choices=Command|DBUS|SysFS|IPMI|RF etc.
          FetchFreqSecs: 5           #Sampling freq in seconds
          StorePolicy: OnChange       #Choices=Periodic|OnChange|OnEvent
          CommandParams:              #applicable only when FetchMethod=Command
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=name"
        - ID: Serial
          <<: *defaults
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=serial"
        - ID: UUID
          <<: *defaults
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=uuid"
    - ID: Versions
      InfoList:
        - ID: Driver
          <<: *defaults
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=driver_version"
        - ID: VBIOS
          <<: *defaults
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=vbios_version"
        - ID: Inforom
          <<: *defaults
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=inforom.oem,inforom.ecc,inforom.pwr"
    - ID: Config
      InfoList:
        - ID: PowerManagementEnabled
          <<: *defaults
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=power.management"
        - ID: MIGMode
          <<: *defaults
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=mig.mode.current"
        - ID: UserConfiguredGraphicsClock
          <<: *defaults
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=clocks.applications.gr"
        - ID: UserConfiguredMemoryClock
          <<: *defaults
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=clocks.applications.mem"
    - ID: Errors
      InfoList:
        - ID: L1CacheErrorsCorrected
          <<: *defaults
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=ecc.errors.corrected.volatile.l1_cache"
        - ID: L2CacheErrorsCorrected
          <<: *defaults
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=ecc.errors.corrected.volatile.l2_cache"
    - ID: Sensors
      InfoList:
        - ID: GPUTemp
          <<: *defaults
          StorePolicy: EveryFetch
          DataType: Uint64
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=temperature.gpu"
        - ID: MemTemp
          <<: *defaults
          StorePolicy: EveryFetch
          DataType: Uint64
          CommandParams:
            Command: "nvidia-smi --id=$gpuid --format=csv,noheader --query-gpu=temperature.gpu"
      CompactionPolicy: Periodic
      CompactionFreqSecs: 60
      CompactionMethod: Average

NIC: &nic
  Params:
    - name: nicid
      value: 0
  InfoGroups:
    - ID: Stats
      InfoList:
        - ID: RxBytes
          DataType: Uint64
          FetchPolicy: Periodic
          FetchFreqSecs: 5
          FetchMethod: DBUS
          StorePolicy: EveryFetch
          DbusParams:
            Service: "org.freedesktop.NetworkManager"
            ObjectPath: "/org/freedesktop/NetworkManager/Devices/$nicid"
            Interface: "org.freedesktop.NetworkManager.Device.Statistics"
            Property: "RxBytes"
      CompactionPolicy: Periodic
      CompactionFreqSecs: 20
      CompactionMethod: Average

Circle: &circ
  Params:
    - name: radius
      value: 20
  InfoGroups:
    - ID: Size
      InfoList:
        - ID: Area
          FetchPolicy: Periodic
          FetchMethod: Command
          FetchFreqSecs: 10
          StorePolicy: OnChange
          CommandParams:
            Command: "echo 3.14*$radius*$radius | bc -l"
        - ID: Circumference
          FetchPolicy: Periodic
          FetchMethod: Command
          FetchFreqSecs: 10
          StorePolicy: OnChange
          CommandParams:
            Command: "echo 2*3.14*$radius | bc -l"

Rectangle: &rect
  Params:
    - name: length
      value: 2
    - name: breadth
      value: 3
  InfoGroups:
    - ID: Size
      InfoList:
        - ID: Area
          FetchMethod: Command
          FetchPath: "echo -n $(($length * $breadth))"
          FetchFreqSecs: 10
        - ID: Perimeter
          FetchMethod: Command
          FetchPath: "echo -n $((2 * $length + 2 * $breadth))"
          FetchFreqSecs: 10

Sections:
  - ID: GPU
    Components:
      - ID: GPU0          #assign an ID
        <<: *gpu          #Inherit all definitions from template
        Params:           #and change parameter values
          - name: gpuid
            value: 0
      - ID: GPU1
        <<: *gpu
        Params:
          - name: gpuid
            value: 1
      - ID: GPU2
        <<: *gpu
        Params:
          - name: gpuid
            value: 2
      - ID: GPU3
        <<: *gpu
        Params:
          - name: gpuid
            value: 3
  - ID: NIC
    Components:
      - ID: NIC1
        <<: *nic
        Params:
          - name: nicid
            value: 1
  - ID: Rectangles
    Components:
      - ID: Rectangles1
        <<: *rect
        Params:
          - name: length
            value: 2
          - name: breadth
            value: 3
  - ID: RoundObjects
    Components:
      - ID: Circle1
        <<: *circ
        Params:
          - name: radius
            value: 20
      - ID: Circle2
        <<: *circ
        Params:
          - name: radius
            value: 40
